services:
  discord-bot:
    build: .
    restart: unless-stopped
    # Reaps the worker threads' child processes and forwards signals, so the
    # container stops cleanly instead of waiting for a kill
    init: true
    environment:
      # Discord configuration
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - COMMAND_PREFIX=${COMMAND_PREFIX:-c64}
      - ALLOW_BOT_UPLOADS=${ALLOW_BOT_UPLOADS:-true}

      # Server configuration
      - PORT=${PORT:-3000}
      - PUBLIC_HOST=${PUBLIC_HOST:-http://localhost:3000}

      # MinIO configuration
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-your-minio-server}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-your-access-key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-your-secret-key}
      - MINIO_BUCKET=${MINIO_BUCKET:-c64files}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}

      # Emulator configuration
      - EMULATOR_OPEN_ROMS=${EMULATOR_OPEN_ROMS:-true}
      - EMULATOR_BORDER=${EMULATOR_BORDER:-false}
      - EMULATOR_AUTOLOAD=${EMULATOR_AUTOLOAD:-true}
      - EMULATOR_WIDE=${EMULATOR_WIDE:-false}

      # File management configuration
      - MAX_FILES=${MAX_FILES:-100}
      - MAX_AGE_DAYS=${MAX_AGE_DAYS:-7}
      - MAX_DELETIONS_PER_RUN=${MAX_DELETIONS_PER_RUN:-25}

      # SID music configuration
      - SID_ENABLED=${SID_ENABLED:-true}
      - SID_RENDER_SECONDS=${SID_RENDER_SECONDS:-180}
      - SID_FADE_SECONDS=${SID_FADE_SECONDS:-5}
      - SID_MP3_BITRATE=${SID_MP3_BITRATE:-128}
      - SID_ENGINE=${SID_ENGINE:-sidlite}
      - SID_RENDER_TIMEOUT_MS=${SID_RENDER_TIMEOUT_MS:-60000}
      - SID_QUEUE_LIMIT=${SID_QUEUE_LIMIT:-8}
      - SID_MAX_INPUT_BYTES=${SID_MAX_INPUT_BYTES:-1048576}
      - SID_MAX_MP3_BYTES=${SID_MAX_MP3_BYTES:-8388608}
      - SID_MAX_FILES_PER_MESSAGE=${SID_MAX_FILES_PER_MESSAGE:-4}
      # Optional, and only useful with a volume mounting the images in
      - SID_KERNAL_ROM=${SID_KERNAL_ROM:-}
      - SID_BASIC_ROM=${SID_BASIC_ROM:-}
      - SID_CHARGEN_ROM=${SID_CHARGEN_ROM:-}
    networks:
      - coolify

networks:
  coolify:
    external: true
